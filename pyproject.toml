[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dbbench"
version = "0.1.0"
description = "Benchmark PostgreSQL and SQLite across Linux machines and VMs (x86_64, ARM64, Raspberry Pi-like)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=7", "psycopg[binary]>=3.1"]

[project.scripts]
dbbench = "dbbench.cli:main"

[tool.setuptools.packages.find]
include = ["dbbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
