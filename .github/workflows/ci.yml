name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bench" --health-interval 2s --health-retries 20
    env:
      DBBENCH_PG_DSN: postgresql://bench:bench@localhost:5432/bench
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: smoke benchmark
        run: |
          dbbench sysinfo --verify-cores
          dbbench run -b all -p smoke -n 1 -l "gha-${{ matrix.os }}-py${{ matrix.python }}"
          dbbench report
